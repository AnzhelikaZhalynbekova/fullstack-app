version: '3.8'

services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  backend:
    build: ./backend

    environment:
      DATABASE_URL: postgresql://postgres:mypassword@postgres:5432/mydb

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: